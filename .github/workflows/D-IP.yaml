name: D-IP
on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"
permissions:
  contents: write
concurrency:
  group: update-rules
  cancel-in-progress: false
jobs:
  d_ip_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Run scripts
        run: |
          bash dev/D-IP.sh
          bash dev/git-push.sh
